name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Contract-freeze checklist: the shared contract must compile first,
      # since every lane builds against it (docs/hackathon/team-split.md).
      - name: Build shared contract
        run: pnpm --filter @slopstream/shared build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Test all packages
        run: pnpm test

      - name: Build production artifacts
        run: pnpm build

      # Mirror the local pre-commit formatting hooks in CI (check-only:
      # CI cannot --write). See .lintstagedrc.json and .husky/pre-commit.
      - name: Prettier (check)
        run: pnpm exec prettier --check "**/*.{json,yml,yaml,ts,tsx,js,jsx,css}"

      - name: Markdownlint
        run: pnpm exec markdownlint-cli2
